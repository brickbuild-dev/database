name: Sync BrickStore database (latest release) and rebuild DB

on:
  schedule:
    # daily (UTC). Adjust if you want a specific local time.
    - cron: "00 00 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests requests-oauthlib

      - name: Fetch latest upstream release metadata
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/rgriebl/brickstore-database/releases/latest"
          curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$API" > .upstream_release.json
          python - <<'PY'
          import json, sys
          j=json.load(open(".upstream_release.json","r",encoding="utf-8"))
          rid=str(j.get("id",""))
          assets=j.get("assets") or []
          z=[a for a in assets if str(a.get("name","")).lower().endswith(".zip")]
          if not z:
              print("No .zip asset found in latest release", file=sys.stderr)
              sys.exit(2)
          a=max(z, key=lambda x: x.get("size") or 0)  # pick largest .zip
          open(".upstream_release_id.txt","w",encoding="utf-8").write(rid)
          open(".upstream_zip_url.txt","w",encoding="utf-8").write(a.get("browser_download_url",""))
          print(f"release_id={rid}")
          print(f"zip={a.get('name')} size={a.get('size')}")
          PY
          echo "release_id=$(cat .upstream_release_id.txt)" >> "$GITHUB_OUTPUT"
          echo "zip_url=$(cat .upstream_zip_url.txt)" >> "$GITHUB_OUTPUT"

      - name: Check if upstream release changed
        id: changed
        run: |
          set -euo pipefail
          mkdir -p inputs/upstream
          OLD=""
          if [ -f inputs/upstream/last_release_id.txt ]; then OLD="$(cat inputs/upstream/last_release_id.txt)"; fi
          NEW="${{ steps.upstream.outputs.release_id }}"
          if [ "$OLD" = "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new upstream release (id=$NEW)."
          else
            echo "$NEW" > inputs/upstream/last_release_id.txt
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New upstream release detected: $NEW (old=$OLD)"
          fi

      - name: Download latest .zip
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p inputs/upstream
          curl -L -o inputs/upstream/brickstore-database.zip "${{ steps.upstream.outputs.zip_url }}"

      - name: Extract required XMLs (part_color_codes.xml only)
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          ZIP="inputs/upstream/brickstore-database.zip"
          mkdir -p inputs/bricklink
          unzip -p "$ZIP" part_color_codes.xml > inputs/bricklink/part_color_codes.xml

      - name: Build DB
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p database
          python brickovery_upstream_v3.py \
            --mode all \
            --db database/brickovery.db \
            --out-csv database/brickovery_db.csv \
            --issues database/part_color_issues.csv \
            --bl-codes-xml inputs/bricklink/part_color_codes.xml \
            --color-map inputs/colors_seed.csv \
            --commit-every 10000 \
            --progress-every 200000

      - name: Commit and push (only if something changed)
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             inputs/upstream/last_release_id.txt             inputs/bricklink/part_color_codes.xml             inputs/upstream/brickstore-database.zip             database/brickovery.db             database/brickovery_db.csv             database/part_color_issues.csv || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: sync database to latest release"
          git push
