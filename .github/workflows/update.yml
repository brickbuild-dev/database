name: Sync BrickStore payload (semantic) + update DB (manual rebuild only)

on:
  schedule:
    # daily (UTC)
    - cron: "00 00 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Se true, força rebuild completo da DB (ignora semantic delta)."
        required: false
        default: false
        type: boolean
      resume_until_done:
        description: "Se true, limita runtime (~5h30) e auto-repete a run até terminar."
        required: false
        default: false
        type: boolean

concurrency:
  group: brickovery-update
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  BACKUP_RETAIN_COUNT: 5
  BACKUP_RETAIN_DAYS: 5
  BACKUP_RETAIN_SIZE_MB: 4096

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      RESUME_MODE: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.resume_until_done == 'true') || github.event_name == 'schedule' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests requests-oauthlib
          fi

      - name: Fetch latest upstream release metadata
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/rgriebl/brickstore-database/releases/latest"
          curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$API" > .upstream_release.json
          python - <<'PY'
          import json, sys
          j=json.load(open(".upstream_release.json","r",encoding="utf-8"))
          rid=str(j.get("id",""))
          assets=j.get("assets") or []
          z=[a for a in assets if str(a.get("name","")).lower().endswith(".zip")]
          if not z:
              print("No .zip asset found in latest release", file=sys.stderr)
              sys.exit(2)
          a=max(z, key=lambda x: x.get("size") or 0)
          open(".upstream_release_id.txt","w",encoding="utf-8").write(rid)
          open(".upstream_zip_url.txt","w",encoding="utf-8").write(a.get("browser_download_url",""))
          print(f"release_id={rid}")
          print(f"zip={a.get('name')} size={a.get('size')}")
          PY
          echo "release_id=$(cat .upstream_release_id.txt)" >> "$GITHUB_OUTPUT"
          echo "zip_url=$(cat .upstream_zip_url.txt)" >> "$GITHUB_OUTPUT"

      - name: Reset resume state on new upstream release
        if: ${{ env.RESUME_MODE == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p inputs/upstream
          old=""
          if [ -f inputs/upstream/last_release_id.txt ]; then
            old="$(cat inputs/upstream/last_release_id.txt || true)"
          fi
          new="${{ steps.upstream.outputs.release_id }}"
          if [ -n "$new" ] && [ "$old" != "$new" ]; then
            echo "Upstream release changed (old=$old, new=$new) -> reset resume_state.json"
            rm -f inputs/upstream/resume_state.json
          fi

      - name: Download latest .zip (temp)
        run: |
          set -euo pipefail
          curl -L -o .latest_brickstore.zip "${{ steps.upstream.outputs.zip_url }}"

      - name: "Semantic gate (CHECK ONLY: compare ZIP vs DB + colors_seed)"
        id: gates
        env:
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || 'false' }}
          PYTHONPATH: ${{ github.workspace }}/database
        run: |
          set -euo pipefail

          ZIP=".latest_brickstore.zip"
          test -f "$ZIP" || { echo "::error::Missing downloaded zip $ZIP"; exit 2; }

          mkdir -p inputs/upstream inputs/bricklink

          if [ ! -f database/brickovery.db ]; then
            echo "database/brickovery.db missing: skipping semantic diff. (Run workflow with force_rebuild to create DB.)"
            TMPDIR="$(mktemp -d)"; trap 'rm -rf "$TMPDIR"' EXIT
            unzip -p "$ZIP" part_color_codes.xml > "$TMPDIR/part_color_codes.xml"
            unzip -qq -o "$ZIP" "items/*.xml" -d "$TMPDIR"
            mkdir -p inputs/bricklink/items
            cp -f "$TMPDIR/part_color_codes.xml" inputs/bricklink/part_color_codes.xml
            rsync -a --delete "$TMPDIR/items/" inputs/bricklink/items/
            mv -f "$ZIP" inputs/upstream/brickstore-database.zip
            echo "upstream_inputs_synced=true" >> "$GITHUB_OUTPUT"
            echo "semantic_new_data=false" >> "$GITHUB_OUTPUT"
            echo "db_delta_needed=false" >> "$GITHUB_OUTPUT"
            echo "force_rebuild=${FORCE_REBUILD}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          export PYTHONPATH="${GITHUB_WORKSPACE}/database:${PYTHONPATH:-}"
          SCRIPT=""
          for c in "tools/upstream_semantic_sync_and_delta.py" "tools/upstream_semantic_sync_and_delta_importfix.py" "database/tools/upstream_semantic_sync_and_delta.py" "database/tools/upstream_semantic_sync_and_delta_importfix.py"; do
            if [ -f "$c" ]; then SCRIPT="$c"; break; fi
          done
          if [ -z "$SCRIPT" ]; then
            SCRIPT="$(find . -maxdepth 5 -type f -name 'upstream_semantic_sync_and_delta*.py' | head -n 1 || true)"
          fi
          test -n "$SCRIPT" || { echo "::error::Cannot find upstream_semantic_sync_and_delta*.py in repo"; ls -la; find . -maxdepth 3 -type d -print; exit 2; }
          echo "Using semantic script: $SCRIPT"

          python "$SCRIPT" --zip "$ZIP" --db database/brickovery.db --color-map inputs/colors_seed.csv --out-zip inputs/upstream/brickstore-database.zip --out-codes-xml inputs/bricklink/part_color_codes.xml --out-parts-xml inputs/bricklink/Parts.xml --out-element-codes-xml inputs/bricklink/codes.xml --out-items-dir inputs/bricklink/items --state-dir inputs/upstream --release-id "${{ steps.upstream.outputs.release_id }}" --json-out .semantic_check.json

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          j=json.load(open('.semantic_check.json','r',encoding='utf-8'))
          sem = bool(j.get('semantic_new_data'))
          print(f"semantic_new_data={str(sem).lower()}")
          print(f"upstream_inputs_synced={str(bool(j.get('copied_upstream_files'))).lower()}")
          print(f"db_delta_needed={str(sem).lower()}")
          PY
          echo "force_rebuild=${FORCE_REBUILD}" >> "$GITHUB_OUTPUT"

      - name: Backup brickovery DB (pre-update, immutable) + audit report
        id: dbbackup
        if: steps.gates.outputs.force_rebuild == 'true' || steps.gates.outputs.db_delta_needed == 'true'
        run: |
          set -euo pipefail
          if [ ! -f database/brickovery.db ]; then
            echo "DB missing: skipping backup."
            exit 0
          fi
          mkdir -p database/backups/brickovery_db database/audit/brickovery_db
          REASON="semantic_delta"
          if [ "${{ steps.gates.outputs.force_rebuild }}" = "true" ]; then REASON="manual_force_rebuild"; fi
          EXTRA=""
          if [ -f .semantic_check.json ]; then EXTRA="--context-json .semantic_check.json"; fi

          python tools/backup_brickovery_db_with_audit.py --db database/brickovery.db --backup-dir database/backups/brickovery_db --audit-dir database/audit/brickovery_db --also-backup-csv database/brickovery_db.csv --reason "$REASON" --retain "${BACKUP_RETAIN_COUNT}" --retain-days "${BACKUP_RETAIN_DAYS}" --retain-size-mb "${BACKUP_RETAIN_SIZE_MB}" $EXTRA > .dbbackup.json

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          j=json.load(open('.dbbackup.json','r',encoding='utf-8'))
          print(f"pre_meta={j.get('meta_file','')}")
          PY

      - name: Force rebuild DB (manual only)
        if: steps.gates.outputs.force_rebuild == 'true'
        env:
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          BRICKLINK_CONSUMER_KEY: ${{ secrets.BRICKLINK_CONSUMER_KEY }}
          BRICKLINK_CONSUMER_SECRET: ${{ secrets.BRICKLINK_CONSUMER_SECRET }}
          BRICKLINK_TOKEN: ${{ secrets.BRICKLINK_TOKEN }}
          BRICKLINK_TOKEN_SECRET: ${{ secrets.BRICKLINK_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          test -f inputs/bricklink/part_color_codes.xml || { echo "::error::Missing inputs/bricklink/part_color_codes.xml"; exit 2; }
          test -d inputs/bricklink/items || { echo "::error::Missing inputs/bricklink/items"; exit 2; }
          mkdir -p database
          # Locate brickovery_upstream_v3 script (repo layout may vary)
          V3="brickovery_upstream_v3.py"
          if [ ! -f "$V3" ] && [ -f "database/brickovery_upstream_v3.py" ]; then V3="database/brickovery_upstream_v3.py"; fi
          if [ ! -f "$V3" ]; then V3="$(find . -maxdepth 4 -type f -name 'brickovery_upstream_v3*.py' | head -n 1 || true)"; fi
          test -n "$V3" && [ -f "$V3" ] || { echo "::error::Cannot find brickovery_upstream_v3*.py in repo"; ls -la; exit 2; }
          echo "Using builder script: $V3"

          python "$V3" \
            --mode build \
            --db database/brickovery.db \
            --out-csv database/brickovery_db.csv \
            --issues database/part_color_issues.csv \
            --bl-codes-xml inputs/bricklink/part_color_codes.xml \
            --items-dir inputs/bricklink/items \
            --color-map inputs/colors_seed.csv \
            --skip-boid \
            --commit-every-auto \
            --progress-every 200000

      - name: Brickovery DB post-update audit (after manual force rebuild)
        if: steps.gates.outputs.force_rebuild == 'true'
        run: |
          set -euo pipefail
          PRE_META="${{ steps.dbbackup.outputs.pre_meta }}"
          EXTRA=""
          if [ -n "${PRE_META:-}" ] && [ -f "$PRE_META" ]; then EXTRA="--pre-meta $PRE_META"; fi
          python tools/brickovery_db_postupdate_report.py --db database/brickovery.db --audit-dir database/audit/brickovery_db --reason manual_force_rebuild $EXTRA

      - name: Apply INSERT-only delta to DB (NO rebuild)
        id: applydelta
        if: steps.gates.outputs.db_delta_needed == 'true' && steps.gates.outputs.force_rebuild != 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/database
        run: |
          set -euo pipefail
          ZIP=".latest_brickstore.zip"
          test -f "$ZIP" || { echo "::error::Missing downloaded zip $ZIP"; exit 2; }

          export PYTHONPATH="${GITHUB_WORKSPACE}/database:${PYTHONPATH:-}"
          SCRIPT=""
          for c in "tools/upstream_semantic_sync_and_delta.py" "tools/upstream_semantic_sync_and_delta_importfix.py" "database/tools/upstream_semantic_sync_and_delta.py" "database/tools/upstream_semantic_sync_and_delta_importfix.py"; do
            if [ -f "$c" ]; then SCRIPT="$c"; break; fi
          done
          if [ -z "$SCRIPT" ]; then
            SCRIPT="$(find . -maxdepth 5 -type f -name 'upstream_semantic_sync_and_delta*.py' | head -n 1 || true)"
          fi
          test -n "$SCRIPT" || { echo "::error::Cannot find upstream_semantic_sync_and_delta*.py in repo"; exit 2; }
          echo "Using semantic script: $SCRIPT"

          python "$SCRIPT" --zip "$ZIP" --db database/brickovery.db --color-map inputs/colors_seed.csv --out-zip inputs/upstream/brickstore-database.zip --out-codes-xml inputs/bricklink/part_color_codes.xml --out-parts-xml inputs/bricklink/Parts.xml --out-element-codes-xml inputs/bricklink/codes.xml --out-items-dir inputs/bricklink/items --state-dir inputs/upstream --release-id "${{ steps.upstream.outputs.release_id }}" --apply-db-delta --json-out .semantic_apply.json

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          j=json.load(open('.semantic_apply.json','r',encoding='utf-8'))
          applied = (j.get('db_inserted_items',0) or 0) + (j.get('db_inserted_codes',0) or 0)
          print(f"db_delta_applied={str(applied>0).lower()}")
          PY

      - name: Repair DB integrity (swap bad rows + normalize item_type)
        if: steps.applydelta.outputs.db_delta_applied == 'true'
        run: |
          set -euo pipefail
          python tools/repair_brickovery_db_integrity_with_audit.py --db database/brickovery.db > .db_repair.json
          echo "DB repair summary:"
          cat .db_repair.json

      - name: Brickovery DB post-update audit (after semantic delta)
        if: steps.applydelta.outputs.db_delta_applied == 'true'
        run: |
          set -euo pipefail
          PRE_META="${{ steps.dbbackup.outputs.pre_meta }}"
          EXTRA=""
          if [ -n "${PRE_META:-}" ] && [ -f "$PRE_META" ]; then EXTRA="--pre-meta $PRE_META"; fi
          python tools/brickovery_db_postupdate_report.py --db database/brickovery.db --audit-dir database/audit/brickovery_db --reason semantic_delta $EXTRA --apply-json .semantic_apply.json

      - name: Check missing BK mapping (pre-mapping, resume)
        id: premap
        if: ${{ env.RESUME_MODE == 'true' }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, sqlite3
          db_path = "database/brickovery.db"
          if not os.path.exists(db_path):
              print("run_mapping=false")
              print("missing_bk=0")
              raise SystemExit(0)

          con = sqlite3.connect(db_path)
          cur = con.cursor()
          cur.execute(
              "SELECT COUNT(1) FROM brickovery_db "
              "WHERE bk_part_id IS NULL OR bk_part_key IS NULL"
          )
          missing_bk = int(cur.fetchone()[0] or 0)
          con.close()

          run_mapping = (missing_bk > 0)
          print(f"missing_bk={missing_bk}")
          print(f"run_mapping={str(run_mapping).lower()}")
          PY

      - name: Validate mapping repo token (read+write)
        if: steps.applydelta.outputs.db_delta_applied == 'true' || steps.gates.outputs.force_rebuild == 'true' || steps.premap.outputs.run_mapping == 'true'
        env:
          MAPPING_REPO_TOKEN: ${{ secrets.MAPPING_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${MAPPING_REPO_TOKEN:-}" || { echo "::error::Missing secrets.MAPPING_REPO_TOKEN (needs read+write access to brickbuild-dev/brikick-secrets)"; exit 2; }

      - name: Checkout mapping repo (private)
        if: steps.applydelta.outputs.db_delta_applied == 'true' || steps.gates.outputs.force_rebuild == 'true' || steps.premap.outputs.run_mapping == 'true'
        uses: actions/checkout@v4
        with:
          repository: brickbuild-dev/brikick-secrets
          token: ${{ secrets.MAPPING_REPO_TOKEN }}
          path: .tmp/mapping
          fetch-depth: 0

      - name: Apply/ensure bk_mapping into DB (and write back with backups + audit)
        if: steps.applydelta.outputs.db_delta_applied == 'true' || steps.gates.outputs.force_rebuild == 'true' || steps.premap.outputs.run_mapping == 'true'
        run: |
          set -euo pipefail
          test -d .tmp/mapping || { echo "::error::Missing mapping checkout (.tmp/mapping)"; exit 2; }
          test -f .tmp/mapping/bk_mapping.csv || { echo "::error::Missing .tmp/mapping/bk_mapping.csv"; exit 2; }
          python tools/apply_bk_mapping_to_db_with_meta_and_audit.py \
            --db database/brickovery.db \
            --bk-mapping-csv .tmp/mapping/bk_mapping.csv \
            --write-csv

      - name: Check missing BOID/weights (pre-BOID, resume)
        id: preboid
        if: ${{ env.RESUME_MODE == 'true' }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, sqlite3
          db_path = "database/brickovery.db"
          if not os.path.exists(db_path):
              print("run_boid=false")
              print("missing_boid=0")
              print("missing_weight=0")
              raise SystemExit(0)

          con = sqlite3.connect(db_path)
          cur = con.cursor()
          cur.execute(
              "SELECT COUNT(1) FROM brickovery_db "
              "WHERE item_type='P' AND (boid IS NULL OR boid='') AND bo_color_id IS NOT NULL"
          )
          missing_boid = int(cur.fetchone()[0] or 0)

          cur.execute(
              "SELECT COUNT(1) FROM brickovery_db "
              "WHERE item_type='P' AND weight IS NULL"
          )
          missing_weight = int(cur.fetchone()[0] or 0)
          con.close()

          run_boid = (missing_boid > 0) or (missing_weight > 0)
          print(f"missing_boid={missing_boid}")
          print(f"missing_weight={missing_weight}")
          print(f"run_boid={str(run_boid).lower()}")
          PY

      - name: Resolve BOID + fill missing weights (BrickOwl + BrickLink)
        if: steps.applydelta.outputs.db_delta_applied == 'true' || steps.gates.outputs.force_rebuild == 'true' || steps.preboid.outputs.run_boid == 'true'
        env:
          BRICKOWL_API_KEY: ${{ secrets.BRICKOWL_API_KEY }}
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          BRICKLINK_CONSUMER_KEY: ${{ secrets.BRICKLINK_CONSUMER_KEY }}
          BRICKLINK_CONSUMER_SECRET: ${{ secrets.BRICKLINK_CONSUMER_SECRET }}
          BRICKLINK_TOKEN: ${{ secrets.BRICKLINK_TOKEN }}
          BRICKLINK_TOKEN_SECRET: ${{ secrets.BRICKLINK_TOKEN_SECRET }}
          RESUME_MODE: ${{ env.RESUME_MODE }}
        run: |
          set -euo pipefail
          V3="brickovery_upstream_v3.py"
          if [ ! -f "$V3" ] && [ -f "database/brickovery_upstream_v3.py" ]; then V3="database/brickovery_upstream_v3.py"; fi
          if [ ! -f "$V3" ]; then V3="$(find . -maxdepth 4 -type f -name 'brickovery_upstream_v3*.py' | head -n 1 || true)"; fi
          test -n "$V3" && [ -f "$V3" ] || { echo "::error::Cannot find brickovery_upstream_v3*.py in repo"; ls -la; exit 2; }
          echo "Using builder script: $V3"

          MAX_RUNTIME_SECONDS=0
          if [ "${RESUME_MODE}" = "true" ]; then
            MAX_RUNTIME_SECONDS=$((5*3600 + 30*60))
          fi

          ARGS=(
            --mode boid
            --db database/brickovery.db
            --out-csv database/brickovery_db.csv
            --issues database/part_color_issues.csv
            --resolve-boid
            --allow-api
            --boid-cache-json database/boid_cache.json
            --bl-codes-xml inputs/bricklink/part_color_codes.xml
            --items-dir inputs/bricklink/items
            --color-map inputs/colors_seed.csv
            --commit-every 10000
            --progress-every 200000
            --boid-commit-every-auto
          )
          if [ "${MAX_RUNTIME_SECONDS}" -gt 0 ]; then
            ARGS+=(--max-runtime-seconds "${MAX_RUNTIME_SECONDS}")
          fi

          python "$V3" "${ARGS[@]}"

      - name: Commit and push mapping repo (only if mapping changed)
        if: steps.applydelta.outputs.db_delta_applied == 'true' || steps.gates.outputs.force_rebuild == 'true' || steps.premap.outputs.run_mapping == 'true'
        run: |
          set -euo pipefail
          cd .tmp/mapping
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bk_mapping.csv backups/ audit/ || true
          if git diff --cached --quiet; then
            echo "No changes to mapping repo."
            exit 0
          fi
          stamp="$(date -u +%Y%m%d_%H%M%SZ)"
          git commit -m "chore: bk_mapping update ${stamp}"
          git push

      - name: Export CSV + issues (no rebuild)
        if: steps.applydelta.outputs.db_delta_applied == 'true' || steps.gates.outputs.force_rebuild == 'true' || steps.preboid.outputs.run_boid == 'true' || steps.premap.outputs.run_mapping == 'true'
        env:
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          BRICKLINK_CONSUMER_KEY: ${{ secrets.BRICKLINK_CONSUMER_KEY }}
          BRICKLINK_CONSUMER_SECRET: ${{ secrets.BRICKLINK_CONSUMER_SECRET }}
          BRICKLINK_TOKEN: ${{ secrets.BRICKLINK_TOKEN }}
          BRICKLINK_TOKEN_SECRET: ${{ secrets.BRICKLINK_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          # Locate brickovery_upstream_v3 script (repo layout may vary)
          V3="brickovery_upstream_v3.py"
          if [ ! -f "$V3" ] && [ -f "database/brickovery_upstream_v3.py" ]; then V3="database/brickovery_upstream_v3.py"; fi
          if [ ! -f "$V3" ]; then V3="$(find . -maxdepth 4 -type f -name 'brickovery_upstream_v3*.py' | head -n 1 || true)"; fi
          test -n "$V3" && [ -f "$V3" ] || { echo "::error::Cannot find brickovery_upstream_v3*.py in repo"; ls -la; exit 2; }
          echo "Using builder script: $V3"

          python "$V3" \
            --mode export \
            --db database/brickovery.db \
            --out-csv database/brickovery_db.csv \
            --issues database/part_color_issues.csv

      - name: Export BL -> BK mapping (dedicated)
        if: steps.applydelta.outputs.db_delta_applied == 'true' || steps.gates.outputs.force_rebuild == 'true' || steps.preboid.outputs.run_boid == 'true' || steps.premap.outputs.run_mapping == 'true'
        run: |
          set -euo pipefail
          python tools/export_bl_to_bk_mapping.py --db database/brickovery.db --out database/bl_to_bk_mapping.csv

      - name: Export BK part key
        if: steps.applydelta.outputs.db_delta_applied == 'true' || steps.gates.outputs.force_rebuild == 'true' || steps.preboid.outputs.run_boid == 'true' || steps.premap.outputs.run_mapping == 'true'
        run: |
          set -euo pipefail
          python tools/export_bk_part_key.py --db database/brickovery.db --out database/bk_part_key.csv

      - name: Generate artifacts + validate
        if: steps.applydelta.outputs.db_delta_applied == 'true' || steps.gates.outputs.force_rebuild == 'true' || steps.preboid.outputs.run_boid == 'true' || steps.premap.outputs.run_mapping == 'true'
        run: |
          set -euo pipefail
          python tools/generate_artifacts.py \
            --db database/brickovery.db \
            --artifacts-dir database/artifacts \
            --inputs-dir inputs \
            --data-version-file inputs/upstream/last_release_id.txt \
            --strict

      - name: Check remaining work (resume gate)
        id: resume
        if: ${{ env.RESUME_MODE == 'true' }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, sqlite3, json, time
          db_path = "database/brickovery.db"
          if not os.path.exists(db_path):
              print("resume_needed=false")
              print("missing_boid=0")
              print("missing_weight=0")
              print("missing_bk=0")
              print("resume_state_key=none")
              raise SystemExit(0)

          con = sqlite3.connect(db_path)
          cur = con.cursor()
          # boid missing: only where bo_color_id exists for parts
          cur.execute(
              "SELECT COUNT(1) FROM brickovery_db "
              "WHERE item_type='P' AND (boid IS NULL OR boid='') AND bo_color_id IS NOT NULL"
          )
          missing_boid = int(cur.fetchone()[0] or 0)

          cur.execute(
              "SELECT COUNT(1) FROM brickovery_db "
              "WHERE item_type='P' AND weight IS NULL"
          )
          missing_weight = int(cur.fetchone()[0] or 0)

          # bk mapping missing
          cur.execute(
              "SELECT COUNT(1) FROM brickovery_db "
              "WHERE bk_part_id IS NULL OR bk_part_key IS NULL"
          )
          missing_bk = int(cur.fetchone()[0] or 0)
          con.close()

          resume_needed = (missing_boid > 0) or (missing_weight > 0) or (missing_bk > 0)

          # Resume state: stop re-dispatch if no progress across runs (accept NULLs).
          state_dir = "inputs/upstream"
          os.makedirs(state_dir, exist_ok=True)
          state_path = os.path.join(state_dir, "resume_state.json")

          payload_key = "unknown"
          sha_path = os.path.join(state_dir, "last_payload_sha256.txt")
          rel_path = os.path.join(state_dir, "last_release_id.txt")
          if os.path.exists(sha_path):
              payload_key = open(sha_path, "r", encoding="utf-8").read().strip() or payload_key
          elif os.path.exists(rel_path):
              payload_key = open(rel_path, "r", encoding="utf-8").read().strip() or payload_key

          state = {}
          if os.path.exists(state_path):
              try:
                  state = json.load(open(state_path, "r", encoding="utf-8"))
              except Exception:
                  state = {}

          entry = state.get(payload_key, {})
          prev_missing = entry.get("missing") or {}
          prev_attempts = int(entry.get("attempts") or 0)
          prev_finalized = bool(entry.get("finalized"))

          current_missing = {
              "boid": missing_boid,
              "weight": missing_weight,
              "bk": missing_bk,
          }

          finalized = False
          attempts = prev_attempts
          if resume_needed:
              if prev_finalized:
                  resume_needed = False
                  finalized = True
              else:
                  if prev_missing == current_missing and prev_attempts >= 1:
                      # No progress since last run -> accept NULLs and stop re-dispatch.
                      resume_needed = False
                      finalized = True
                  else:
                      attempts = prev_attempts + 1
          else:
              finalized = True

          state[payload_key] = {
              "updated_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "missing": current_missing,
              "attempts": attempts,
              "finalized": finalized,
          }
          with open(state_path, "w", encoding="utf-8") as f:
              json.dump(state, f, ensure_ascii=False, indent=2)

          print(f"missing_boid={missing_boid}")
          print(f"missing_weight={missing_weight}")
          print(f"missing_bk={missing_bk}")
          print(f"resume_state_key={payload_key}")
          print(f"resume_needed={str(resume_needed).lower()}")
          PY

      - name: Write resume state audit summary
        if: ${{ env.RESUME_MODE == 'true' && steps.resume.outputs.resume_state_key != 'none' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time

          state_path = "inputs/upstream/resume_state.json"
          key = os.environ.get("RESUME_KEY","").strip()
          if not os.path.exists(state_path) or not key:
              raise SystemExit(0)

          with open(state_path, "r", encoding="utf-8") as f:
              state = json.load(f) or {}
          entry = state.get(key, {})
          missing = entry.get("missing") or {}

          stamp = time.strftime("%Y%m%d_%H%M%SZ", time.gmtime())
          out_dir = "database/audit/brickovery_db"
          os.makedirs(out_dir, exist_ok=True)
          out_path = os.path.join(out_dir, f"resume_state_summary_{stamp}.md")

          lines = []
          lines.append(f"# Resume State Summary — {stamp}")
          lines.append("")
          lines.append(f"- payload_key: `{key}`")
          lines.append(f"- missing_boid: `{missing.get('boid', 0)}`")
          lines.append(f"- missing_weight: `{missing.get('weight', 0)}`")
          lines.append(f"- missing_bk: `{missing.get('bk', 0)}`")
          lines.append(f"- attempts: `{entry.get('attempts', 0)}`")
          lines.append(f"- finalized: `{bool(entry.get('finalized'))}`")
          lines.append("")
          with open(out_path, "w", encoding="utf-8") as f:
              f.write("\n".join(lines))
          PY
        env:
          RESUME_KEY: ${{ steps.resume.outputs.resume_state_key }}

      - name: Commit and push (only if something changed)
        if: steps.gates.outputs.upstream_inputs_synced == 'true' || steps.applydelta.outputs.db_delta_applied == 'true' || steps.gates.outputs.force_rebuild == 'true' || steps.preboid.outputs.run_boid == 'true' || steps.premap.outputs.run_mapping == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only generated artifacts
          git add \
            database/audit/brickovery_db \
            database/backups/brickovery_db \
            database/artifacts \
            database/bl_to_bk_mapping.csv \
            database/bk_part_key.csv \
            database/boid_cache.json \
            database/bricklink_api_cache.json \
            inputs/upstream/brickstore-database.zip \
            inputs/upstream/last_payload_sha256.txt \
            inputs/upstream/last_release_id.txt \
            inputs/upstream/resume_state.json \
            inputs/bricklink/part_color_codes.xml \
            inputs/bricklink/Parts.xml \
            inputs/bricklink/codes.xml \
            inputs/bricklink/items \
            database/brickovery.db \
            database/brickovery_db.csv \
            database/part_color_issues.csv \
            || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          if [ "${{ steps.gates.outputs.force_rebuild }}" = "true" ]; then
            msg="chore: rebuild DB (manual force)"
          elif [ "${{ steps.applydelta.outputs.db_delta_applied }}" = "true" ]; then
            msg="chore: apply upstream semantic delta"
          else
            msg="chore: sync upstream inputs (DB missing)"
          fi

          git commit -m "$msg"
          git push

      - name: Auto-dispatch next run (resume until done)
        if: ${{ env.RESUME_MODE == 'true' && steps.resume.outputs.resume_needed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Resume requested and missing data detected. Dispatching new run..."
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/dispatches"
          payload='{"ref":"'"${GITHUB_REF_NAME}"'","inputs":{"resume_until_done":"true"}}'
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -d "$payload" "$api"
