name: Brickovery - Build DB (resume-safe)

"on":
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild do zero (apaga DB/checkpoint/cache antes de correr)'
        type: boolean
        required: false
        default: false
      skip_boid:
        description: 'Desativar resolução de BOID (BrickOwl)'
        type: boolean
        required: false
        default: false
      debug_apis:
        description: 'Executar self-tests de APIs e logs extra'
        type: boolean
        required: false
        default: false
  schedule:
    # Re-executa regularmente para retomar a build caso tenha terminado por max-runtime.
    - cron: '17 */2 * * *'

# Evita execuções em paralelo que poderiam corromper outputs/commits.
concurrency:
  group: brickovery-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests requests_oauthlib
          fi

      - name: Prepare outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          # touch para evitar 'No files were found' em uploads/commits quando falha cedo
          : > data/brickovery_build_error.log || true

      - name: Force rebuild (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'FORCE=true -> apagar DB/checkpoint/cache/exports'
          rm -f \
            data/brickovery.db \
            data/brickovery_db.csv \
            data/part_color_issues.csv \
            data/build_checkpoint.json \
            data/brickowl_api_cache.json \
            data/brickovery_build_error.log

      - name: Build DB + export CSV (BOID por defeito)
        env:
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          BRICKOWL_API_KEY: ${{ secrets.BRICKOWL_API_KEY }}
          BRICKLINK_CONSUMER_KEY: ${{ secrets.BRICKLINK_CONSUMER_KEY }}
          BRICKLINK_CONSUMER_SECRET: ${{ secrets.BRICKLINK_CONSUMER_SECRET }}
          BRICKLINK_TOKEN: ${{ secrets.BRICKLINK_TOKEN }}
          BRICKLINK_TOKEN_SECRET: ${{ secrets.BRICKLINK_TOKEN_SECRET }}
          # Para triggers schedule/push, inputs não existem. Estes defaults evitam erro.
          SKIP_BOID: ${{ github.event.inputs.skip_boid || 'false' }}
          DEBUG_APIS: ${{ github.event.inputs.debug_apis || 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          # Resolve o caminho do script (ajusta conforme a tua estrutura no repo)
          SCRIPT="tools/brickovery_upstream_v3_boid_default.py"
          if [ ! -f "$SCRIPT" ]; then SCRIPT="brickovery_upstream_v3_boid_default.py"; fi
          if [ ! -f "$SCRIPT" ]; then SCRIPT="scripts/brickovery_upstream_v3_boid_default.py"; fi
          if [ ! -f "$SCRIPT" ]; then
            echo "ERRO: não encontrei o script brickovery_upstream_v3_boid_default.py em tools/, scripts/ ou root." >&2
            echo "Coloca o ficheiro no repo (ex.: tools/brickovery_upstream_v3_boid_default.py)" >&2
            exit 2
          fi

          ARGS=(
            --bl-codes-xml "inputs/bricklink/codes.xml"
            --bl-colors-xml "inputs/bricklink/colors.xml"
            --items-dir "inputs/bricklink/items"
            --color-map "inputs/colors_seed.csv"
            --db "data/brickovery.db"
            --out-csv "data/brickovery_db.csv"
            --issues "data/part_color_issues.csv"
            --checkpoint "data/build_checkpoint.json"
            --boid-cache-json "data/brickowl_api_cache.json"
            --max-runtime-seconds 19800
          )

          if [ "${SKIP_BOID}" = "true" ]; then
            ARGS+=(--skip-boid)
          fi
          if [ "${DEBUG_APIS}" = "true" ]; then
            ARGS+=(--debug-apis)
          fi

          echo "Running: python $SCRIPT ${ARGS[*]}"
          python "$SCRIPT" "${ARGS[@]}"

      - name: Print checkpoint summary (best-effort)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f data/build_checkpoint.json ]; then
            echo '--- build_checkpoint.json ---'
            cat data/build_checkpoint.json
            echo
          else
            echo 'Sem checkpoint (a build pode ter falhado antes de criar o ficheiro).'
          fi

      - name: Commit outputs back to repo
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Ajusta o que queres versionar
          git add -A data/ || true

          if git diff --cached --quiet; then
            echo "Sem alterações para commit."
            exit 0
          fi

          git commit -m "brickovery: update db/csv (run $GITHUB_RUN_ID)" || true
          git push

      - name: Upload artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brickovery-data
          path: |
            data/brickovery.db
            data/brickovery_db.csv
            data/part_color_issues.csv
            data/build_checkpoint.json
            data/brickowl_api_cache.json
            data/brickovery_build_error.log
          if-no-files-found: warn
