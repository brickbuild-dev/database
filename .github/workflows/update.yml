name: Sync upstream + update brickovery DB (semantic + chunked rebuild)

on:
  schedule:
    - cron: "00 00 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild DB ONLY when true. Otherwise apply INSERT-only deltas when upstream ZIP contains new semantic data."
        required: false
        default: false
        type: boolean
      auto_continue:
        description: "Force-rebuild only: re-dispatch automatically until staged rebuild is complete."
        required: false
        default: true
        type: boolean
      auto_continue_max_runs:
        description: "Safety cap for auto-continue loops (force-rebuild only)."
        required: false
        default: 30
        type: number
      reset_rebuild_workspace:
        description: "Force-rebuild only: wipe database/.rebuild workspace and start fresh."
        required: false
        default: false
        type: boolean
      boid_debug:
        description: "Show verbose BOID/weights debug output (very noisy)."
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests requests-oauthlib

      - name: Fetch latest upstream release metadata
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/rgriebl/brickstore-database/releases/latest"
          curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$API" > .upstream_release.json
          python - <<'PY'
          import json, sys
          j=json.load(open(".upstream_release.json","r",encoding="utf-8"))
          rid=str(j.get("id",""))
          assets=j.get("assets") or []
          z=[a for a in assets if str(a.get("name","")).lower().endswith(".zip")]
          if not z:
              print("No .zip asset found in latest release", file=sys.stderr)
              sys.exit(2)
          a=max(z, key=lambda x: x.get("size") or 0)
          open(".upstream_release_id.txt","w",encoding="utf-8").write(rid)
          open(".upstream_zip_url.txt","w",encoding="utf-8").write(a.get("browser_download_url",""))
          print(f"release_id={rid}")
          print(f"zip={a.get('name')} size={a.get('size')}")
          PY
          echo "release_id=$(cat .upstream_release_id.txt)" >> "$GITHUB_OUTPUT"
          echo "zip_url=$(cat .upstream_zip_url.txt)" >> "$GITHUB_OUTPUT"

      - name: Download latest .zip (temp)
        run: |
          set -euo pipefail
          curl -L -o .latest_brickstore.zip "${{ steps.upstream.outputs.zip_url }}"

      - name: Configure DB paths (staged rebuild workspace for force)
        id: dbpaths
        env:
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_rebuild == 'true' }}
          RESET_WORKSPACE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.reset_rebuild_workspace == 'true' }}
        run: |
          set -euo pipefail

          # Chunk runtime: keep margin vs 350min job timeout
          echo "CHUNK_MAX_RUNTIME_SECONDS=18000" >> "$GITHUB_ENV"   # 300 min
          echo "HEARTBEAT_SECONDS=60" >> "$GITHUB_ENV"

          if [ "${FORCE_REBUILD}" = "true" ]; then
            mkdir -p database/.rebuild
            if [ "${RESET_WORKSPACE}" = "true" ]; then
              echo "Reset requested: wiping database/.rebuild/*"
              rm -rf database/.rebuild/*
              mkdir -p database/.rebuild
            fi
            echo "DB_TARGET=database/.rebuild/brickovery_work.db" >> "$GITHUB_ENV"
            echo "CSV_TARGET=database/.rebuild/brickovery_db.csv" >> "$GITHUB_ENV"
            echo "ISSUES_TARGET=database/.rebuild/part_color_issues.csv" >> "$GITHUB_ENV"
            echo "CHECKPOINT_TARGET=database/.rebuild/checkpoint.json" >> "$GITHUB_ENV"
            echo "STAGED_REBUILD=true" >> "$GITHUB_ENV"
          else
            echo "DB_TARGET=database/brickovery.db" >> "$GITHUB_ENV"
            echo "CSV_TARGET=database/brickovery_db.csv" >> "$GITHUB_ENV"
            echo "ISSUES_TARGET=database/part_color_issues.csv" >> "$GITHUB_ENV"
            echo "CHECKPOINT_TARGET=database/checkpoint.json" >> "$GITHUB_ENV"
            echo "STAGED_REBUILD=false" >> "$GITHUB_ENV"
          fi

      - name: Semantic gate (compare ZIP vs DB + colors_seed)
        id: gates
        env:
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_rebuild == 'true' }}
        run: |
          set -euo pipefail

          ZIP=".latest_brickstore.zip"
          test -f "$ZIP" || { echo "::error::Missing downloaded zip $ZIP"; exit 2; }

          # If DB missing, just sync upstream files into repo inputs and stop.
          if [ ! -f database/brickovery.db ]; then
            echo "::notice::database/brickovery.db missing: syncing upstream inputs only. Run with force_rebuild=true to create DB."
            TMPDIR="$(mktemp -d)"; trap 'rm -rf "$TMPDIR"' EXIT
            unzip -p "$ZIP" part_color_codes.xml > "$TMPDIR/part_color_codes.xml"
            unzip -qq -o "$ZIP" "items/*.xml" -d "$TMPDIR"
            mkdir -p inputs/upstream inputs/bricklink/items
            cp -f "$TMPDIR/part_color_codes.xml" inputs/bricklink/part_color_codes.xml
            rsync -a --delete "$TMPDIR/items/" inputs/bricklink/items/
            mv -f "$ZIP" inputs/upstream/brickstore-database.zip

            echo "upstream_inputs_synced=true" >> "$GITHUB_OUTPUT"
            echo "semantic_new_data=false" >> "$GITHUB_OUTPUT"
            echo "db_delta_needed=false" >> "$GITHUB_OUTPUT"
            echo "force_rebuild=${FORCE_REBUILD}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test -f tools/upstream_semantic_sync_and_delta_importfix.py || { echo "::error::Missing tools/upstream_semantic_sync_and_delta_importfix.py"; ls -la tools || true; exit 2; }

          python tools/upstream_semantic_sync_and_delta_importfix.py             --zip "$ZIP"             --db database/brickovery.db             --color-map inputs/colors_seed.csv             --out-zip inputs/upstream/brickstore-database.zip             --out-codes-xml inputs/bricklink/part_color_codes.xml             --out-items-dir inputs/bricklink/items             --state-dir inputs/upstream             --release-id "${{ steps.upstream.outputs.release_id }}"             --json-out .semantic_check.json

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          j=json.load(open('.semantic_check.json','r',encoding='utf-8'))
          sem = bool(j.get('semantic_new_data'))
          print(f"semantic_new_data={str(sem).lower()}")
          print(f"upstream_inputs_synced={str(bool(j.get('copied_upstream_files'))).lower()}")
          print(f"db_delta_needed={str(sem).lower()}")
          PY
          echo "force_rebuild=${FORCE_REBUILD}" >> "$GITHUB_OUTPUT"

      - name: Backup brickovery DB (pre-update, immutable) + audit
        id: dbbackup
        if: steps.gates.outputs.force_rebuild == 'true' || steps.gates.outputs.db_delta_needed == 'true'
        run: |
          set -euo pipefail
          if [ ! -f database/brickovery.db ]; then
            echo "DB missing: skipping backup."
            exit 0
          fi
          test -f tools/backup_brickovery_db_with_audit.py || { echo "::error::Missing tools/backup_brickovery_db_with_audit.py"; exit 2; }

          mkdir -p database/backups/brickovery_db database/audit/brickovery_db

          REASON="semantic_delta"
          if [ "${{ steps.gates.outputs.force_rebuild }}" = "true" ]; then REASON="manual_force_rebuild"; fi

          EXTRA=""
          if [ -f .semantic_check.json ]; then EXTRA="--context-json .semantic_check.json"; fi

          python tools/backup_brickovery_db_with_audit.py             --db database/brickovery.db             --backup-dir database/backups/brickovery_db             --audit-dir database/audit/brickovery_db             --also-backup-csv database/brickovery_db.csv             --reason "$REASON" $EXTRA > .dbbackup.json

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          j=json.load(open('.dbbackup.json','r',encoding='utf-8'))
          print(f"pre_meta={j.get('meta_file','')}")
          PY

      - name: Force rebuild DB (chunk-safe, staged) - base build
        if: steps.gates.outputs.force_rebuild == 'true'
        env:
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          BRICKLINK_CONSUMER_KEY: ${{ secrets.BRICKLINK_CONSUMER_KEY }}
          BRICKLINK_CONSUMER_SECRET: ${{ secrets.BRICKLINK_CONSUMER_SECRET }}
          BRICKLINK_TOKEN: ${{ secrets.BRICKLINK_TOKEN }}
          BRICKLINK_TOKEN_SECRET: ${{ secrets.BRICKLINK_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          test -f inputs/bricklink/part_color_codes.xml || { echo "::error::Missing inputs/bricklink/part_color_codes.xml"; exit 2; }
          test -d inputs/bricklink/items || { echo "::error::Missing inputs/bricklink/items"; exit 2; }
          test -f brickovery_upstream_v3.py || { echo "::error::Missing brickovery_upstream_v3.py at repo root"; ls -la; exit 2; }

          BASE_FLAG="database/.rebuild/base_build_complete.flag"
          if [ -f "${DB_TARGET}" ] && [ -f "${BASE_FLAG}" ]; then
            echo "Base build already complete; skipping."
            exit 0
          fi
          rm -f "${BASE_FLAG}" || true

          python -u brickovery_upstream_v3.py             --mode build             --db "${DB_TARGET}"             --out-csv "${CSV_TARGET}"             --issues "${ISSUES_TARGET}"             --bl-codes-xml inputs/bricklink/part_color_codes.xml             --items-dir inputs/bricklink/items             --color-map inputs/colors_seed.csv             --checkpoint "${CHECKPOINT_TARGET}"             --max-runtime-seconds "${CHUNK_MAX_RUNTIME_SECONDS}"             --commit-every 10000             --progress-every 200000

          if [ -f "${ISSUES_TARGET}" ] && grep -q "EARLY_EXIT_MAX_RUNTIME" "${ISSUES_TARGET}"; then
            echo "::notice::Base build stopped early; leaving base flag unset."
          else
            touch "${BASE_FLAG}"
          fi

      - name: Apply INSERT-only semantic delta (no rebuild)
        id: applydelta
        if: steps.gates.outputs.db_delta_needed == 'true' && steps.gates.outputs.force_rebuild != 'true'
        run: |
          set -euo pipefail
          ZIP=".latest_brickstore.zip"
          test -f "$ZIP" || { echo "::error::Missing downloaded zip $ZIP"; exit 2; }

          python tools/upstream_semantic_sync_and_delta_importfix.py             --zip "$ZIP"             --db database/brickovery.db             --color-map inputs/colors_seed.csv             --out-zip inputs/upstream/brickstore-database.zip             --out-codes-xml inputs/bricklink/part_color_codes.xml             --out-items-dir inputs/bricklink/items             --state-dir inputs/upstream             --release-id "${{ steps.upstream.outputs.release_id }}"             --apply-db-delta             --json-out .semantic_apply.json

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          j=json.load(open('.semantic_apply.json','r',encoding='utf-8'))
          applied = (j.get('db_inserted_items',0) or 0) + (j.get('db_inserted_codes',0) or 0)
          print(f"db_delta_applied={str(applied>0).lower()}")
          PY

      - name: Repair DB integrity (after delta)
        if: steps.applydelta.outputs.db_delta_applied == 'true'
        run: |
          set -euo pipefail
          test -f tools/repair_brickovery_db_integrity_with_audit.py || { echo "::error::Missing tools/repair_brickovery_db_integrity_with_audit.py"; exit 2; }
          python tools/repair_brickovery_db_integrity_with_audit.py --db database/brickovery.db > .db_repair.json
          cat .db_repair.json

      - name: Checkout mapping repo (private)
        if: steps.applydelta.outputs.db_delta_applied == 'true' || steps.gates.outputs.force_rebuild == 'true'
        uses: actions/checkout@v4
        with:
          repository: brickbuild-dev/brikick-secrets
          token: ${{ secrets.MAPPING_REPO_TOKEN }}
          path: .tmp/mapping
          fetch-depth: 0

      - name: Apply/ensure bk_mapping into DB (write-back with backups + audit)
        if: steps.applydelta.outputs.db_delta_applied == 'true' || steps.gates.outputs.force_rebuild == 'true'
        run: |
          set -euo pipefail
          test -f tools/apply_bk_mapping_to_db_with_meta_and_audit.py || { echo "::error::Missing tools/apply_bk_mapping_to_db_with_meta_and_audit.py"; exit 2; }
          test -f .tmp/mapping/bk_mapping.csv || { echo "::error::Missing .tmp/mapping/bk_mapping.csv"; exit 2; }

          python tools/apply_bk_mapping_to_db_with_meta_and_audit.py             --db "${DB_TARGET}"             --bk-mapping-csv .tmp/mapping/bk_mapping.csv             --write-csv

      - name: Resolve BOID (BrickOwl) with live heartbeat
        if: steps.applydelta.outputs.db_delta_applied == 'true' || steps.gates.outputs.force_rebuild == 'true'
        env:
          PYTHONUNBUFFERED: "1"
          BOID_DEBUG: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.boid_debug == 'true') && 'true' || 'false' }}
          BRICKOWL_API_KEY: ${{ secrets.BRICKOWL_API_KEY }}
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          BRICKLINK_CONSUMER_KEY: ${{ secrets.BRICKLINK_CONSUMER_KEY }}
          BRICKLINK_CONSUMER_SECRET: ${{ secrets.BRICKLINK_CONSUMER_SECRET }}
          BRICKLINK_TOKEN: ${{ secrets.BRICKLINK_TOKEN }}
          BRICKLINK_TOKEN_SECRET: ${{ secrets.BRICKLINK_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          test -f brickovery_upstream_v3.py || { echo "::error::Missing brickovery_upstream_v3.py"; exit 2; }

          EXTRA_ARGS=()
          if [ "${BOID_DEBUG}" = "true" ]; then
            echo "::notice::boid_debug enabled -> passing --debug-apis (very noisy)"
            EXTRA_ARGS+=(--debug-apis)
          fi

          echo "::group::BOID config"
          echo "DB_TARGET=${DB_TARGET}"
          echo "CHECKPOINT_TARGET=${CHECKPOINT_TARGET}"
          echo "CHUNK_MAX_RUNTIME_SECONDS=${CHUNK_MAX_RUNTIME_SECONDS}"
          echo "HEARTBEAT_SECONDS=${HEARTBEAT_SECONDS}"
          echo "::endgroup::"

          # Run BOID resolver (weights disabled here to avoid blocking BOID)
          python -u brickovery_upstream_v3.py             --mode boid             --db "${DB_TARGET}"             --out-csv "${CSV_TARGET}"             --issues "${ISSUES_TARGET}"             --resolve-boid             --skip-weights             --boid-cache-json database/boid_cache.json             --bl-codes-xml inputs/bricklink/part_color_codes.xml             --items-dir inputs/bricklink/items             --color-map inputs/colors_seed.csv             --checkpoint "${CHECKPOINT_TARGET}"             --max-runtime-seconds "${CHUNK_MAX_RUNTIME_SECONDS}"             --commit-every 10000             --progress-every 50000             "${EXTRA_ARGS[@]}"             &
          PID=$!

          # Heartbeat: query progress every HEARTBEAT_SECONDS
          while kill -0 "$PID" 2>/dev/null; do
            python - <<'PY'
          import os, sqlite3, time
          db = os.environ.get("DB_TARGET")
          issues = os.environ.get("ISSUES_TARGET")
          ts = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
          if not db:
              print(f"[heartbeat {ts}] DB_TARGET missing", flush=True)
              raise SystemExit(0)
          try:
              con = sqlite3.connect(db, timeout=1)
              con.execute("PRAGMA busy_timeout=500")
              cur = con.cursor()
              def s(q):
                  r = cur.execute(q).fetchone()
                  return int(r[0]) if r and r[0] is not None else 0
              total = s("SELECT COUNT(1) FROM brickovery_db")
              null_boid_pu = s("SELECT COUNT(1) FROM brickovery_db WHERE boid IS NULL AND item_type IN ('P','U')")
              null_weight_pu = s("SELECT COUNT(1) FROM brickovery_db WHERE weight IS NULL AND item_type IN ('P','U')")
              print(f"[heartbeat {ts}] total={total} boid_null(P|U)={null_boid_pu} weight_null(P|U)={null_weight_pu}", flush=True)
              con.close()
          except Exception as e:
              print(f"[heartbeat {ts}] sqlite_error={type(e).__name__}: {e}", flush=True)

          # Show last issues lines (if any) for live diagnostics
          if issues and os.path.exists(issues):
              try:
                  with open(issues, "rb") as f:
                      data = f.read()[-4096:]
                  tail = data.decode("utf-8", errors="replace").splitlines()[-3:]
                  for ln in tail:
                      print(f"[issues-tail {ts}] {ln}", flush=True)
              except Exception as e:
                  print(f"[issues-tail {ts}] error={type(e).__name__}: {e}", flush=True)
          PY
            sleep "${HEARTBEAT_SECONDS}"
          done

          wait "$PID"

      - name: Fill missing weights (CSV + BrickLink) with live heartbeat
        if: steps.applydelta.outputs.db_delta_applied == 'true' || steps.gates.outputs.force_rebuild == 'true'
        env:
          PYTHONUNBUFFERED: "1"
          BOID_DEBUG: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.boid_debug == 'true') && 'true' || 'false' }}
          BRICKLINK_CONSUMER_KEY: ${{ secrets.BRICKLINK_CONSUMER_KEY }}
          BRICKLINK_CONSUMER_SECRET: ${{ secrets.BRICKLINK_CONSUMER_SECRET }}
          BRICKLINK_TOKEN: ${{ secrets.BRICKLINK_TOKEN }}
          BRICKLINK_TOKEN_SECRET: ${{ secrets.BRICKLINK_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          test -f brickovery_upstream_v3.py || { echo "::error::Missing brickovery_upstream_v3.py"; exit 2; }

          EXTRA_ARGS=()
          if [ "${BOID_DEBUG}" = "true" ]; then
            echo "::notice::boid_debug enabled -> passing --debug-apis (very noisy)"
            EXTRA_ARGS+=(--debug-apis)
          fi

          echo "::group::WEIGHTS config"
          echo "DB_TARGET=${DB_TARGET}"
          echo "CHUNK_MAX_RUNTIME_SECONDS=${CHUNK_MAX_RUNTIME_SECONDS}"
          echo "HEARTBEAT_SECONDS=${HEARTBEAT_SECONDS}"
          echo "::endgroup::"

          # Run weights fill in a separate phase (does not resolve BOID)
          python -u brickovery_upstream_v3.py             --mode export             --db "${DB_TARGET}"             --out-csv "${CSV_TARGET}"             --issues "${ISSUES_TARGET}"             --bl-codes-xml inputs/bricklink/part_color_codes.xml             --items-dir inputs/bricklink/items             --color-map inputs/colors_seed.csv             --checkpoint "${CHECKPOINT_TARGET}"             --max-runtime-seconds "${CHUNK_MAX_RUNTIME_SECONDS}"             --commit-every 20000             --progress-every 100000             "${EXTRA_ARGS[@]}"             &
          PID=$!

          while kill -0 "$PID" 2>/dev/null; do
            python - <<'PY'
          import os, sqlite3, time
          db = os.environ.get("DB_TARGET")
          issues = os.environ.get("ISSUES_TARGET")
          ts = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
          if not db:
              print(f"[heartbeat {ts}] DB_TARGET missing", flush=True)
              raise SystemExit(0)
          try:
              con = sqlite3.connect(db, timeout=1)
              con.execute("PRAGMA busy_timeout=500")
              cur = con.cursor()
              def s(q):
                  r = cur.execute(q).fetchone()
                  return int(r[0]) if r and r[0] is not None else 0
              null_weight_pu = s("SELECT COUNT(1) FROM brickovery_db WHERE weight IS NULL AND item_type IN ('P','U')")
              miss_parts = s("SELECT COUNT(DISTINCT bl_part_id) FROM brickovery_db WHERE weight IS NULL AND bl_part_id IS NOT NULL AND item_type IN ('P','U')")
              print(f"[heartbeat {ts}] weight_null(P|U)_rows={null_weight_pu} missing_parts(P|U)={miss_parts}", flush=True)
              con.close()
          except Exception as e:
              print(f"[heartbeat {ts}] sqlite_error={type(e).__name__}: {e}", flush=True)

          if issues and os.path.exists(issues):
              try:
                  with open(issues, "rb") as f:
                      data = f.read()[-4096:]
                  tail = data.decode("utf-8", errors="replace").splitlines()[-3:]
                  for ln in tail:
                      print(f"[issues-tail {ts}] {ln}", flush=True)
              except Exception as e:
                  print(f"[issues-tail {ts}] error={type(e).__name__}: {e}", flush=True)
          PY
            sleep "${HEARTBEAT_SECONDS}"
          done

          wait "$PID"

      - name: Commit and push mapping repo (only if mapping changed)
        if: steps.applydelta.outputs.db_delta_applied == 'true' || steps.gates.outputs.force_rebuild == 'true'
        run: |
          set -euo pipefail
          cd .tmp/mapping
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bk_mapping.csv backups/ audit/ || true
          if git diff --cached --quiet; then
            echo "No changes to mapping repo."
            exit 0
          fi
          stamp="$(date -u +%Y%m%d_%H%M%SZ)"
          git commit -m "chore: bk_mapping update ${stamp}"
          git push

      - name: Export CSV + issues
        if: steps.applydelta.outputs.db_delta_applied == 'true' || steps.gates.outputs.force_rebuild == 'true'
        run: |
          set -euo pipefail
          python -u brickovery_upstream_v3.py             --mode export             --db "${DB_TARGET}"             --out-csv "${CSV_TARGET}"             --issues "${ISSUES_TARGET}"

      - name: Finalize staged rebuild (swap only when complete)
        id: finalize
        if: steps.gates.outputs.force_rebuild == 'true'
        run: |
          set -e
          INCOMPLETE=0
          if [ -f "${ISSUES_TARGET}" ]; then
            if grep -qE "EARLY_EXIT_MAX_RUNTIME|STOP_SIGNAL" "${ISSUES_TARGET}"; then
              INCOMPLETE=1
            fi
          fi

          if [ "${INCOMPLETE}" = "1" ]; then
            echo "staged_finalized=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staged rebuild not complete. Keeping database/.rebuild/. Re-run with force_rebuild."
            exit 0
          fi

          cp -f "${DB_TARGET}" database/brickovery.db
          cp -f "${CSV_TARGET}" database/brickovery_db.csv
          cp -f "${ISSUES_TARGET}" database/part_color_issues.csv

          PRE_META="${{ steps.dbbackup.outputs.pre_meta }}"
          EXTRA=""
          if [ -n "${PRE_META:-}" ] && [ -f "$PRE_META" ]; then EXTRA="--pre-meta $PRE_META"; fi

          python tools/brickovery_db_postupdate_report.py             --db database/brickovery.db             --audit-dir database/audit/brickovery_db             --reason manual_force_rebuild             $EXTRA

          rm -rf database/.rebuild || true
          echo "staged_finalized=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push (main repo)
        if: steps.gates.outputs.upstream_inputs_synced == 'true' || steps.applydelta.outputs.db_delta_applied == 'true' || steps.gates.outputs.force_rebuild == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add inputs/upstream inputs/bricklink || true
          git add database/audit/brickovery_db database/backups/brickovery_db || true

          if [ "${{ steps.gates.outputs.force_rebuild }}" = "true" ]; then
            if [ -d database/.rebuild ]; then git add database/.rebuild || true; fi
            if [ "${{ steps.finalize.outputs.staged_finalized }}" = "true" ]; then
              git add database/brickovery.db database/brickovery_db.csv database/part_color_issues.csv || true
            fi
          else
            git add database/brickovery.db database/brickovery_db.csv database/part_color_issues.csv || true
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          if [ "${{ steps.gates.outputs.force_rebuild }}" = "true" ]; then
            if [ "${{ steps.finalize.outputs.staged_finalized }}" = "true" ]; then
              msg="chore: rebuild DB (manual force) [finalized]"
            else
              msg="chore: rebuild DB (manual force) [staged chunk]"
            fi
          elif [ "${{ steps.applydelta.outputs.db_delta_applied }}" = "true" ]; then
            msg="chore: apply upstream semantic delta"
          else
            msg="chore: sync upstream inputs"
          fi

          git commit -m "$msg"
          git push

      - name: Auto-continue staged rebuild (force only)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_rebuild == 'true' && github.event.inputs.auto_continue == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Continue only if staging workspace still exists (not finalized)
          if [ ! -d "database/.rebuild" ]; then
            echo "No staging workspace. Nothing to continue."
            exit 0
          fi

          COUNT_FILE="database/.rebuild/auto_continue_count.txt"
          MAX_RUNS="${{ github.event.inputs.auto_continue_max_runs }}"
          if [ -z "${MAX_RUNS:-}" ]; then MAX_RUNS="30"; fi
          if [ ! -f "${COUNT_FILE}" ]; then echo "0" > "${COUNT_FILE}"; fi
          CUR="$(cat "${COUNT_FILE}" | tr -d '\r\n' || echo 0)"
          case "${CUR}" in
            ''|*[!0-9]*) CUR="0";;
          esac
          NEXT=$((CUR+1))
          echo "${NEXT}" > "${COUNT_FILE}"

          if [ "${NEXT}" -gt "${MAX_RUNS}" ]; then
            echo "::warning::Auto-continue reached MAX_RUNS=${MAX_RUNS}. Stopping to avoid loops."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${COUNT_FILE}" || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: staged rebuild auto-continue ${NEXT}/${MAX_RUNS}"
            git push
          fi

          echo "Dispatching next run (auto-continue ${NEXT}/${MAX_RUNS})..."
          gh workflow run "${GITHUB_WORKFLOW}" --ref "${GITHUB_REF_NAME}"             -f force_rebuild=true             -f auto_continue=true             -f auto_continue_max_runs="${MAX_RUNS}"             -f reset_rebuild_workspace=false             -f boid_debug="${{ github.event.inputs.boid_debug }}"
