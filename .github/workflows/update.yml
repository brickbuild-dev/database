name: Brickovery - Build DB (resume-safe)

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild do zero (apaga DB/checkpoint/cache antes de correr)'
        type: boolean
        required: false
        default: false
      skip_boid:
        description: 'Desativar resolução de BOID (BrickOwl)'
        type: boolean
        required: false
        default: false
      debug_apis:
        description: 'Executar self-tests de APIs e logs extra'
        type: boolean
        required: false
        default: false
  schedule:
    # Re-executa regularmente para retomar a build caso tenha terminado por max-runtime.
    - cron: '17 */2 * * *'

concurrency:
  group: brickovery-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests requests_oauthlib
          fi

      - name: Prepare outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          : > data/brickovery_build_error.log || true

      - name: Force rebuild (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'FORCE=true -> apagar DB/checkpoint/cache/exports'
          rm -f             data/brickovery.db             data/brickovery_db.csv             data/part_color_issues.csv             data/build_checkpoint.json             data/brickowl_api_cache.json             data/brickovery_build_error.log

      - name: Locate builder script
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          # Procura scripts prováveis sem assumir pasta/nome exato.
          mapfile -t CAND < <(find . -maxdepth 6 -type f \(             -name 'brickovery_upstream_v3_boid_default.py' -o             -name 'brickovery_upstream_v3.py' -o             -name 'brickovery_upstream_v3*.py' -o             -name 'brickovery_upstream*.py'           \) | sed 's|^\./||' | sort)

          echo "Candidatos encontrados:"
          if [ ${#CAND[@]} -eq 0 ]; then
            echo "(nenhum)"
          else
            printf '%s\n' "${CAND[@]}"
          fi

          SCRIPT=""
          for p in "${CAND[@]}"; do
            case "$p" in
              *brickovery_upstream_v3_boid_default.py) SCRIPT="$p"; break ;;
            esac
          done
          if [ -z "$SCRIPT" ]; then
            for p in "${CAND[@]}"; do
              case "$p" in
                *brickovery_upstream_v3.py) SCRIPT="$p"; break ;;
              esac
            done
          fi
          if [ -z "$SCRIPT" ] && [ ${#CAND[@]} -gt 0 ]; then
            SCRIPT="${CAND[0]}"
          fi

          if [ -z "$SCRIPT" ]; then
            echo "ERRO: não encontrei nenhum script brickovery_upstream*.py no repo." >&2
            echo "Solução: adiciona o builder ao repo (ex.: tools/brickovery_upstream_v3.py) e volta a correr." >&2
            exit 2
          fi

          echo "Selecionado: $SCRIPT"
          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"

          # Detecta flags suportadas via --help (sem adivinhar versões)
          HELP="$(python "$SCRIPT" --help 2>&1 || true)"
          echo "$HELP" | grep -q -- '--skip-boid'     && echo "supports_skip_boid=true" >> "$GITHUB_OUTPUT" || echo "supports_skip_boid=false" >> "$GITHUB_OUTPUT"
          echo "$HELP" | grep -q -- '--resolve-boid'  && echo "supports_resolve_boid=true" >> "$GITHUB_OUTPUT" || echo "supports_resolve_boid=false" >> "$GITHUB_OUTPUT"
          echo "$HELP" | grep -q -- '--mode'          && echo "supports_mode=true" >> "$GITHUB_OUTPUT" || echo "supports_mode=false" >> "$GITHUB_OUTPUT"
          echo "$HELP" | grep -q -- '--debug-apis'    && echo "supports_debug_apis=true" >> "$GITHUB_OUTPUT" || echo "supports_debug_apis=false" >> "$GITHUB_OUTPUT"

      - name: Build DB + export CSV (BOID por defeito)
        env:
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          BRICKOWL_API_KEY: ${{ secrets.BRICKOWL_API_KEY }}
          BRICKLINK_CONSUMER_KEY: ${{ secrets.BRICKLINK_CONSUMER_KEY }}
          BRICKLINK_CONSUMER_SECRET: ${{ secrets.BRICKLINK_CONSUMER_SECRET }}
          BRICKLINK_TOKEN: ${{ secrets.BRICKLINK_TOKEN }}
          BRICKLINK_TOKEN_SECRET: ${{ secrets.BRICKLINK_TOKEN_SECRET }}
          SKIP_BOID: ${{ github.event.inputs.skip_boid || 'false' }}
          DEBUG_APIS: ${{ github.event.inputs.debug_apis || 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="${{ steps.locate.outputs.script }}"
          SUPPORTS_SKIP_BOID="${{ steps.locate.outputs.supports_skip_boid }}"
          SUPPORTS_RESOLVE_BOID="${{ steps.locate.outputs.supports_resolve_boid }}"
          SUPPORTS_MODE="${{ steps.locate.outputs.supports_mode }}"
          SUPPORTS_DEBUG_APIS="${{ steps.locate.outputs.supports_debug_apis }}"

          ARGS=(
            --bl-codes-xml "inputs/bricklink/codes.xml"
            --bl-colors-xml "inputs/bricklink/colors.xml"
            --items-dir "inputs/bricklink/items"
            --color-map "inputs/colors_seed.csv"
            --db "data/brickovery.db"
            --out-csv "data/brickovery_db.csv"
            --issues "data/part_color_issues.csv"
            --checkpoint "data/build_checkpoint.json"
            --boid-cache-json "data/brickowl_api_cache.json"
            --max-runtime-seconds 198000
          )

          # DEBUG_APIS (apenas se a flag existir)
          if [ "${DEBUG_APIS}" = "true" ] && [ "$SUPPORTS_DEBUG_APIS" = "true" ]; then
            ARGS+=(--debug-apis)
          fi

          # BOID: por defeito ativo (best-effort). Skip apenas se solicitado.
          if [ "${SKIP_BOID}" = "true" ]; then
            if [ "$SUPPORTS_SKIP_BOID" = "true" ]; then
              ARGS+=(--skip-boid)
            else
              echo "SKIP_BOID=true mas este script não suporta --skip-boid; vou apenas NÃO ativar --resolve-boid."
            fi
          else
            # Garantir BOID ativo mesmo em versões antigas
            if [ "$SUPPORTS_RESOLVE_BOID" = "true" ]; then
              ARGS+=(--resolve-boid)
            fi
            if [ "$SUPPORTS_MODE" = "true" ]; then
              ARGS+=(--mode all)
            fi
          fi

          echo "Running: python $SCRIPT ${ARGS[*]}"
          python "$SCRIPT" "${ARGS[@]}"

      - name: Print checkpoint summary (best-effort)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f data/build_checkpoint.json ]; then
            echo '--- build_checkpoint.json ---'
            cat data/build_checkpoint.json
            echo
          else
            echo 'Sem checkpoint (a build pode ter falhado antes de criar o ficheiro).'
          fi

      - name: Commit outputs back to repo
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A data/ || true
          if git diff --cached --quiet; then
            echo "Sem alterações para commit."
            exit 0
          fi

          git commit -m "brickovery: update db/csv (run $GITHUB_RUN_ID)" || true
          git push

      - name: Upload artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brickovery-data
          path: |
            data/brickovery.db
            data/brickovery_db.csv
            data/part_color_issues.csv
            data/build_checkpoint.json
            data/brickowl_api_cache.json
            data/brickovery_build_error.log
          if-no-files-found: warn
