name: CI (smoke)

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests requests-oauthlib
          fi

      - name: Verify DB exists
        shell: bash
        run: |
          set -euo pipefail
          test -f database/brickovery.db

      - name: Python syntax check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import py_compile
          for p in [
              'brickovery_upstream_v3.py',
              'tools/generate_artifacts.py',
              'tools/export_bl_to_bk_mapping.py',
              'tools/export_bk_part_key.py',
              'tools/upstream_semantic_sync_and_delta_importfix.py',
              'tools/backup_brickovery_db_with_audit.py',
          ]:
              py_compile.compile(p, doraise=True)
          print("py_compile ok")
          PY

      - name: True build (fixture)
        shell: bash
        run: |
          set -euo pipefail
          TMPDIR="$(mktemp -d)"
          mkdir -p "$TMPDIR/items"
          cat > "$TMPDIR/part_color_codes.xml" <<'XML'
          <INVENTORY>
            <ITEM>
              <ITEMTYPE>P</ITEMTYPE>
              <ITEMID>3001</ITEMID>
              <COLOR>1</COLOR>
            </ITEM>
          </INVENTORY>
          XML
          cat > "$TMPDIR/items/P.xml" <<'XML'
          <INVENTORY>
            <ITEM>
              <ITEMTYPE>P</ITEMTYPE>
              <ITEMID>3001</ITEMID>
            </ITEM>
          </INVENTORY>
          XML
          cat > "$TMPDIR/Parts.xml" <<'XML'
          <INVENTORY>
            <ITEM>
              <ITEMTYPE>P</ITEMTYPE>
              <ITEMID>3001</ITEMID>
              <ITEMNAME>Brick 2 x 4</ITEMNAME>
            </ITEM>
          </INVENTORY>
          XML
          cat > "$TMPDIR/codes.xml" <<'XML'
          <INVENTORY>
            <ITEM>
              <ITEMTYPE>P</ITEMTYPE>
              <ITEMID>3001</ITEMID>
              <COLOR>White</COLOR>
              <CODENAME>300121</CODENAME>
            </ITEM>
          </INVENTORY>
          XML
          cat > "$TMPDIR/colors_seed.csv" <<'CSV'
          color_name,bl_color_name,bl_color_id,bo_color_id,rb_color_id,bk_color_id
          White,White,1,1,1,1
          CSV

          python brickovery_upstream_v3.py \
            --mode build \
            --db /tmp/brickovery_test.db \
            --out-csv /tmp/brickovery_test.csv \
            --issues /tmp/brickovery_issues.csv \
            --bl-codes-xml "$TMPDIR/part_color_codes.xml" \
            --items-dir "$TMPDIR/items" \
            --color-map "$TMPDIR/colors_seed.csv" \
            --bl-parts-xml "$TMPDIR/Parts.xml" \
            --bl-element-codes-xml "$TMPDIR/codes.xml" \
            --skip-boid \
            --skip-weights \
            --commit-every 10 \
            --progress-every 1000 \
            --no-lock

          python - <<'PY'
          import sqlite3
          con = sqlite3.connect("/tmp/brickovery_test.db")
          cur = con.cursor()
          rows = cur.execute("SELECT COUNT(1) FROM brickovery_db").fetchone()[0]
          con.close()
          assert rows >= 1, f"expected >=1 row, got {rows}"
          print("fixture build ok")
          PY

      - name: Smoke export
        shell: bash
        run: |
          set -euo pipefail
          python brickovery_upstream_v3.py \
            --mode export \
            --db database/brickovery.db \
            --out-csv /tmp/brickovery_db.csv \
            --issues /tmp/part_color_issues.csv

      - name: Export BL -> BK mapping
        shell: bash
        run: |
          set -euo pipefail
          python tools/export_bl_to_bk_mapping.py \
            --db database/brickovery.db \
            --out /tmp/bl_to_bk_mapping.csv

      - name: Export BK part key
        shell: bash
        run: |
          set -euo pipefail
          python tools/export_bk_part_key.py \
            --db database/brickovery.db \
            --out /tmp/bk_part_key.csv

      - name: Generate artifacts + validate
        shell: bash
        run: |
          set -euo pipefail
          python tools/generate_artifacts.py \
            --db database/brickovery.db \
            --artifacts-dir /tmp/artifacts \
            --inputs-dir inputs \
            --data-version-file inputs/upstream/last_release_id.txt \
            --strict \
            --no-update-meta
